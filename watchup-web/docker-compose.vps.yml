services:
  web:
    image: nginx:alpine
    container_name: watchup-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik
      - watchup-internal
    labels:
      traefik.enable: "true"
      traefik.http.routers.watchup-web.entrypoints: websecure
      traefik.http.routers.watchup-web.rule: Host(`watchup.srv1282987.hstgr.cloud`)
      traefik.http.routers.watchup-web.tls: "true"
      traefik.http.routers.watchup-web.tls.certresolver: mytlschallenge
      traefik.http.services.watchup-web.loadbalancer.server.port: "80"

networks:
  traefik:
    external: true
  watchup-internal:
    external: true
