services:
  whatsapp-bridge:
    build: { context: . }
    image: watchup/whatsapp-bridge:local
    container_name: watchup-whatsapp-bridge
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      WHATSAPP_BRIDGE_HOST: 0.0.0.0
      WHATSAPP_BRIDGE_PORT: "8080"
      WATCHUP_PRIVACY_MODE: "true"
      WEBHOOK_URL: ""
      WATCHUP_WEBHOOK_URL: http://watchup-api:8769/watchup/events
      WATCHUP_TENANT_ID: ${WATCHUP_TENANT_ID:?set in protected bridge environment}
      WATCHUP_CHILD_ID: ${WATCHUP_CHILD_ID:?set in protected bridge environment}
      WATCHUP_WEBHOOK_SECRET_FILE: /run/secrets/watchup_webhook_secret
    volumes:
      - type: bind
        source: ${WATCHUP_BRIDGE_SESSION_DIR_HOST:?set a host directory on encrypted storage}
        target: /app/store
      - type: bind
        source: ${WATCHUP_WEBHOOK_SECRET_FILE_HOST:?set protected host secret path}
        target: /run/secrets/watchup_webhook_secret
        read_only: true
    networks: [watchup-internal, watchup-bridge-egress]

networks:
  watchup-internal:
    external: true
  watchup-bridge-egress:
    external: true
